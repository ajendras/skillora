<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-label="Skillora — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="572" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="572" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">Skillora — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#00ff9f">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 0.90s steps(20) 0.60s forwards" fill="#e5e7eb">pip install skillora</text>
<text x="50" y="100" class="l" style="animation:show .01s 1.80s forwards" fill="#94a3b8">Collecting skillora</text>
<text x="50" y="126" class="l" style="animation:show .01s 2.02s forwards" fill="#4ade80">Successfully installed skillora-0.1.0 typer pydantic rich</text>
<text x="28" y="178" class="l" style="animation:show .01s 2.59s forwards"><tspan fill="#00ff9f">❯</tspan></text><text x="50" y="178" class="l ty" style="animation:show .01s 2.59s forwards,type 2.20s steps(68) 2.59s forwards" fill="#e5e7eb">skillora new weather-skill --desc &quot;Fetch current weather for a city&quot;</text>
<text x="50" y="204" class="l" style="animation:show .01s 5.09s forwards" fill="#94a3b8">Created skillora/skills/weather_skill.py</text>
<text x="50" y="230" class="l" style="animation:show .01s 5.31s forwards" fill="#94a3b8">Template includes execute(), tests and metadata. Next: fill the fetch logic.</text>
<text x="28" y="282" class="l" style="animation:show .01s 5.88s forwards"><tspan fill="#00ff9f">❯</tspan></text><text x="50" y="282" class="l ty" style="animation:show .01s 5.88s forwards,type 1.22s steps(27) 5.88s forwards" fill="#e5e7eb">skillora test weather-skill</text>
<text x="50" y="308" class="l" style="animation:show .01s 7.40s forwards" fill="#94a3b8">Running 18 tests (12 generated + 6 manual)…</text>
<text x="50" y="334" class="l" style="animation:show .01s 7.62s forwards" fill="#94a3b8">✅ 18 passed in 0.8s</text>
<text x="50" y="360" class="l" style="animation:show .01s 7.84s forwards" fill="#94a3b8">Benchmark score: 0.94 (latency p95=210ms)</text>
<text x="28" y="412" class="l" style="animation:show .01s 8.41s forwards"><tspan fill="#00ff9f">❯</tspan></text><text x="50" y="412" class="l ty" style="animation:show .01s 8.41s forwards,type 2.12s steps(47) 8.41s forwards" fill="#e5e7eb">skillora benchmark weather-skill --scenarios 50</text>
<text x="50" y="438" class="l" style="animation:show .01s 10.83s forwards" fill="#94a3b8">Scenario run complete.</text>
<text x="50" y="464" class="l" style="animation:show .01s 11.05s forwards" fill="#94a3b8">Accuracy 96% • Avg latency 187ms • Tokens 124</text>
<text x="50" y="490" class="l" style="animation:show .01s 11.27s forwards" fill="#94a3b8">Report written to weather-skill-bench.md</text>
<g class="l" style="animation:show .01s 11.84s forwards"><text x="28" y="542" fill="#00ff9f">❯</text><rect class="cur" x="50" y="527" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
