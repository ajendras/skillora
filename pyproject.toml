[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillora"
version = "0.1.0"
description = "Scaffolds, validates, tests and benchmarks reusable skills for LLM agents with zero boilerplate."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    { name = "Skillora Team", email = "hello@skillora.dev" },
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "pytest>=7.0",
]
keywords = ["llm", "agents", "skills", "benchmarking", "ai", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.scripts]
skillora = "skillora.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
